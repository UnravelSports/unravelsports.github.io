<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse all posts from UnravelSports - Sports Data Analytics Research & Engineering Consultancy">
  <meta name="author" content="Joris Bekkers">

  <title>Archive | UnravelSports</title>


  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SB9D75Z1MR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-SB9D75Z1MR');
  </script>


  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Stylesheets -->
  <!-- Header, footer, filters and post cards come from components.css. -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="imgs/350x350_transparant_square_white.png">

  <style>
    /* Site header, footer, filters and post cards: css/components.css */

    /* The shared .filter-buttons bottom margin is tuned for the front page,
       where it controls band-to-carousel clearance. The archive grid wants
       more room. */
    .filter-buttons { margin-bottom: 50px; }

    .archive-container {
      max-width: 1200px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .archive-header {
      text-align: center;
      margin-bottom: 60px;
    }

    .archive-title {
      font-size: 3rem;
      color: var(--clr-primary);
      margin-bottom: 20px;
    }

    .archive-subtitle {
      font-size: 1.2rem;
      color: var(--clr-highlight);
    }

    /* Posts Grid */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 30px;
      margin-bottom: 60px;
    }

    /* Matches the flat card treatment in components.css: square, hairline
       border, no lift or shadow on hover. */
    .archive-post-card {
      background: none;
      border-radius: 0;
      padding: 26px 24px;
      border: 1px solid rgba(230, 182, 17, 0.18);
      transition: all var(--transition-normal);
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .archive-post-card:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(230, 182, 17, 0.55);
    }

    .post-category-badge {
      display: inline-block;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 0;
      background: rgba(230, 182, 17, 0.12);
      color: var(--clr-primary);
      margin-bottom: 15px;
      align-self: flex-start;
    }

    .archive-post-date {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--clr-highlight);
      margin-bottom: 12px;
    }

    .archive-post-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--clr-white);
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .archive-post-excerpt {
      font-size: 1rem;
      color: var(--clr-white);
      opacity: 0.8;
      line-height: 1.6;
      flex-grow: 1;
      margin-bottom: 15px;
    }

    .archive-post-link {
      color: var(--clr-primary) !important;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: gap var(--transition-fast);
    }

    .archive-post-link:link,
    .archive-post-link:visited,
    .archive-post-link:active {
      color: var(--clr-primary) !important;
    }

    .archive-post-link:hover {
      gap: 10px;
      color: var(--clr-primary) !important;
    }

    .archive-post-link::after {
      content: '→';
      font-size: 1.2rem;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--clr-highlight);
    }

    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    /* Animations */
    .fade-in-up {
      animation: fadeInUp 0.6s ease-out;
    }


    /* Responsive */
    @media screen and (max-width: 768px) {
      .archive-title {
        font-size: 2rem;
      }

      .posts-grid {
        grid-template-columns: 1fr;
      }


    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="header-container">
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="archive.html">All Posts</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="archive-container">
    <header class="archive-header fade-in-up">
      <h1 class="archive-title">Archive</h1>
      <p class="archive-subtitle">Browse all posts by category</p>
    </header>

    <!-- Filter Buttons -->
    <div class="filter-buttons fade-in-up" id="filter-buttons">
      <!-- Dynamically generated -->
    </div>

    <!-- Posts Grid -->
    <div class="posts-grid" id="posts-grid">
      <!-- Dynamically generated -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-content">
      <p class="footer-text">
        &copy; 2025 UnravelSports
      </p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/posts-data.js"></script>
  <script src="js/site.js"></script>

  <script>
    let currentFilter = 'all';

    // Format date
    function formatDate(dateString) {
      const date = new Date(dateString);
      const options = { year: 'numeric', month: 'long', day: 'numeric' };
      return date.toLocaleDateString('en-US', options);
    }

    // Create post card
    function createPostCard(post) {
      const categoryData = categories[post.category];
      const card = document.createElement('div');
      card.className = 'archive-post-card fade-in-up';
      card.setAttribute('data-category', post.category);

      // Entries flagged hideReadMore have no markdown file behind them, so
      // post.html would render "Failed to load post content". Send those to
      // their external source instead, using the same priority order as
      // createPostCard() in js/carousel.js.
      const externalUrl = post.hideReadMore
        ? (post.websiteUrl || post.githubUrl || post.youtubeUrl ||
           post.spotifyUrl || post.articleUrl || post.paperUrl)
        : null;

      const titleWithoutEmoji = post.title
        .replace(/^[\u{1F000}-\u{1FFFF}]/u, '')
        .replace(/^[\u{2600}-\u{27BF}]/u, '')
        .replace(/^[🌀🎙️🔬💻📱]\s*/, '')
        .trim();

      let linkHtml;
      if (externalUrl) {
        card.onclick = () => window.open(externalUrl, '_blank', 'noopener,noreferrer');
        linkHtml = `<a href="${externalUrl}" target="_blank" rel="noopener" class="archive-post-link" onclick="event.stopPropagation();">Visit</a>`;
      } else {
        card.onclick = () => window.location.href = `post.html?id=${post.id}`;
        linkHtml = `<a href="post.html?id=${post.id}" class="archive-post-link" onclick="event.stopPropagation();">Read more</a>`;
      }

      card.innerHTML = `
        <div class="post-category-badge">${categoryData.name}</div>
        <div class="archive-post-date">${formatDate(post.date)}</div>
        <h3 class="archive-post-title">${titleWithoutEmoji}</h3>
        <p class="archive-post-excerpt">${post.excerpt}</p>
        ${linkHtml}
      `;

      return card;
    }

    // Render posts
    function renderPosts(filter = 'all') {
      const grid = document.getElementById('posts-grid');
      grid.innerHTML = '';

      let filteredPosts = filter === 'all'
        ? postsData
        : getPostsByCategory(filter);

      if (filteredPosts.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <h3>No posts found</h3>
            <p>Try selecting a different category.</p>
          </div>
        `;
        return;
      }

      filteredPosts.forEach(post => {
        grid.appendChild(createPostCard(post));
      });
    }

    // Setup filters
    function setupFilters() {
      const container = document.getElementById('filter-buttons');

      // All posts button
      const allButton = document.createElement('button');
      allButton.className = 'filter-button active';
      allButton.innerHTML = `
        <span>All Posts</span>
        <span class="filter-count">(${postsData.length})</span>
      `;
      allButton.onclick = () => filterPosts('all');
      container.appendChild(allButton);

      // Category buttons
      Object.entries(categories).forEach(([key, data]) => {
        const button = document.createElement('button');
        button.className = 'filter-button';
        button.setAttribute('data-filter', key);

        // Text only, matching the front page: no emoji and no logo image, so
        // the row reads as a single typographic unit.
        button.innerHTML = `
          <span>${data.name}</span>
          <span class="filter-count">(${data.count})</span>
        `;
        button.onclick = () => filterPosts(key);
        container.appendChild(button);
      });
    }

    // Filter posts
    function filterPosts(category) {
      currentFilter = category;

      // Update active button
      document.querySelectorAll('.filter-button').forEach(btn => {
        btn.classList.remove('active');
      });

      if (category === 'all') {
        document.querySelector('.filter-button').classList.add('active');
      } else {
        document.querySelector(`[data-filter="${category}"]`).classList.add('active');
      }

      // Render filtered posts
      renderPosts(category);

      // Scroll to posts
      document.getElementById('posts-grid').scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      setupFilters();
      renderPosts('all');

      // Check URL for filter parameter
      const urlParams = new URLSearchParams(window.location.search);
      const filterParam = urlParams.get('filter');
      if (filterParam && (filterParam === 'all' || categories[filterParam])) {
        filterPosts(filterParam);
      }
    });
  </script>
</body>
</html>
